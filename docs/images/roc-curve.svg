<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" width="340" height="340" font-family="sans-serif" font-size="11">
  <title>ROC curve of the fraud model</title>
  <rect x="0" y="0" width="340" height="340" fill="#ffffff"/>
  <!-- area under the curve -->
  <polygon points="50,290 52.7,194 58,146 66,98 90,74 156.7,50 290,50 290,290" fill="#1e88e5" fill-opacity="0.15"/>
  <!-- axes and frame -->
  <rect x="50" y="50" width="240" height="240" fill="none" stroke="#9e9e9e"/>
  <!-- random model: the diagonal -->
  <line x1="50" y1="290" x2="290" y2="50" stroke="#9e9e9e" stroke-dasharray="5,4"/>
  <text x="200" y="185" fill="#616161" transform="rotate(-45 200 185)">random model (AUC 0.5)</text>
  <!-- ROC curve -->
  <polyline points="50,290 52.7,194 58,146 66,98 90,74 156.7,50 290,50" fill="none" stroke="#1e88e5" stroke-width="2.5"/>
  <g fill="#1e88e5">
    <circle cx="52.7" cy="194" r="3.5"/>
    <circle cx="58" cy="146" r="3.5"/>
    <circle cx="66" cy="98" r="5"/>
    <circle cx="90" cy="74" r="3.5"/>
    <circle cx="156.7" cy="50" r="3.5"/>
  </g>
  <text x="62" y="200" fill="#212121">0.9</text>
  <text x="66" y="152" fill="#212121">0.7</text>
  <text x="74" y="104" fill="#212121" font-weight="bold">0.5</text>
  <text x="96" y="86" fill="#212121">0.3</text>
  <text x="150" y="66" fill="#212121">0.1</text>
  <text x="160" y="160" fill="#1565c0">AUC ≈ 0.94</text>
  <!-- ticks -->
  <g fill="#212121" text-anchor="middle">
    <text x="50" y="305">0</text>
    <text x="170" y="305">0.5</text>
    <text x="290" y="305">1</text>
    <text x="170" y="325">False positive rate (genuine customers flagged)</text>
  </g>
  <g fill="#212121" text-anchor="end">
    <text x="44" y="294">0</text>
    <text x="44" y="174">0.5</text>
    <text x="44" y="54">1</text>
  </g>
  <text x="14" y="170" fill="#212121" text-anchor="middle" transform="rotate(-90 14 170)">True positive rate (frauds caught)</text>
  <text x="170" y="30" fill="#212121" text-anchor="middle" font-weight="bold">Labels: threshold of each point</text>
</svg>
