site_name: How LLMs Work
site_description: Plain-English notes on how large language models work, with worked numeric examples.
site_author: Alexandre Dutier
site_url: https://alex2t.github.io/how-llms-work/
repo_url: https://github.com/alex2t/how-llms-work
repo_name: alex2t/how-llms-work
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.tabs          # chapter navigation bar at the top
    - navigation.tabs.sticky   # keep the bar visible while scrolling
    - navigation.footer        # "Previous / Next" chapter buttons at the bottom
    - navigation.top           # back-to-top button
    - navigation.indexes
    - toc.follow               # right-hand table of contents follows the reader
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - "0 · Introduction": 00-introduction.md
  - "1 · Transformers": 01-transformers.md
  - "2 · Training": 02-training.md
  - "3 · Inference": 03-inference.md
  - "4 · Quantization": 04-quantization.md
  - "5 · Evaluation": 05-evaluation.md
  - "6 · Prompting": 06-prompting.md
  - "7 · RAG": 07-rag.md
  - "8 · RAG security": 08-rag-security.md
  - "9 · Advanced RAG": 09-advanced-rag.md
  - "10 · The future of RAG": 10-future-of-rag.md
  - "11 · Agents": 11-agents.md
  - "12 · Deploying agents": 12-deploying-agents.md
  - "13 · Fine-tuning": 13-fine-tuning.md

plugins:
  - search
  - redirects:
      redirect_maps:
        08-agents.md: 11-agents.md   # Agents was Chapter 8 until the RAG security chapter was added
        09-agents.md: 11-agents.md   # Agents was Chapter 9 until the Advanced RAG chapters were added
        12-agents.md: 11-agents.md   # Chapters 10 to 12 moved down by one to close the gap at Chapter 9
        11-future-of-rag.md: 10-future-of-rag.md
        10-advanced-rag.md: 09-advanced-rag.md

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/tabs.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/numbering.js
  - javascripts/header-offset.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
